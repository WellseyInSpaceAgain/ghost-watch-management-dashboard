services:
  ghost-watch:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Eve__ClientId: ${Eve__ClientId:-}
      Eve__ClientSecret: ${Eve__ClientSecret:-}
      Eve__CallbackUrl: ${Eve__CallbackUrl:-http://localhost:8080/api/auth/eve/callback}
    volumes:
      - ghost-watch-data:/app/data
    restart: unless-stopped
volumes:
  ghost-watch-data:
